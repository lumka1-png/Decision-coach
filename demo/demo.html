<!doctype html>
<html><head><meta charset="utf-8"><title>Decision Coach Demo</title>
<style>
:root{--bg1:#173F5A;--bg2:#0B2233;--panel:#0F2C41;--panel2:#12344C;--line:rgba(255,255,255,.09);--text:#EAF1F6;--muted:#9DB3C4;--gold:#F2B544;--gold2:#FFD27A;--gray:#5F7C92;--user:#22587B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg2);font-family:Inter,"DejaVu Sans",sans-serif;color:var(--text)}
#stage{position:relative;width:1920px;height:1080px;background:radial-gradient(1400px 900px at 20% 0%,#1B4866 0%,transparent 60%),linear-gradient(135deg,var(--bg1),var(--bg2));overflow:hidden}
.scene{position:absolute;inset:0;opacity:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1.big{font-size:104px;font-weight:800;letter-spacing:-2px}
.sub{font-size:36px;color:var(--muted);margin-top:22px;max-width:1300px;line-height:1.35}
.gold{color:var(--gold)}
/* hook */
.hookq{font-size:92px;font-weight:800;letter-spacing:-1.5px}
.chips{display:flex;gap:26px;margin-top:56px;flex-wrap:wrap;justify-content:center;max-width:1600px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:20px 34px;font-size:32px;color:var(--text)}
.hookline{font-size:40px;color:var(--muted);margin-top:64px}
/* demo layout */
.topbar{position:absolute;left:100px;right:100px;top:44px;height:72px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:18px;font-size:30px;font-weight:700}
.pill{font-size:26px;font-weight:600;padding:14px 26px;border-radius:999px;background:rgba(242,181,68,.13);color:var(--gold2);border:1px solid rgba(242,181,68,.35)}
.chat{position:absolute;left:100px;top:146px;width:1100px;height:880px;background:var(--panel);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.chathead{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:12px;color:var(--muted);font-size:22px}
.dot{width:14px;height:14px;border-radius:50%;background:#2A4B63}
.chathead .tag{margin-left:auto;font-size:20px;color:var(--gold2);background:rgba(242,181,68,.1);padding:6px 14px;border-radius:999px}
.viewport{position:absolute;top:64px;left:0;right:0;bottom:0;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 48px);mask-image:linear-gradient(to bottom,transparent 0,#000 48px)}
.content{position:absolute;left:0;right:0;top:0;padding:30px 36px 40px}
.row{overflow:hidden}
.inner{padding-bottom:16px}
.ubub{margin-left:auto;max-width:760px;width:fit-content;background:var(--user);border-radius:24px 24px 6px 24px;padding:20px 26px;font-size:28px;line-height:1.42}
.caret{display:inline-block;width:3px;height:30px;background:var(--text);vertical-align:-5px;margin-left:2px}
.coach{display:flex;gap:18px;align-items:flex-start}
.av{width:46px;height:46px;flex:none}
.av.ph{visibility:hidden}
.cb{flex:1;font-size:27px;line-height:1.45;color:var(--text)}
.lbl{display:block;font-size:19px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.lean{border:2px solid var(--gold);background:rgba(242,181,68,.08);border-radius:18px;padding:18px 22px}
.lean b{color:var(--gold2)}
.muted{color:var(--muted)}
.cb ol{margin:8px 0 0 34px}.cb li{margin:4px 0}
.think{display:flex;gap:10px;padding:14px 0 14px 64px}
.think span{width:14px;height:14px;border-radius:50%;background:var(--muted)}
.notes{position:absolute;left:1250px;top:146px;width:570px;height:880px}
.noteshead{font-size:21px;font-weight:700;letter-spacing:2px;color:var(--gold);text-transform:uppercase;height:64px;display:flex;align-items:center}
.nview{position:absolute;top:64px;left:0;right:0;bottom:0;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 56px);mask-image:linear-gradient(to bottom,transparent 0,#000 56px)}
.ncontent{position:absolute;left:0;right:0;top:0}
.note{border-left:4px solid var(--gray);padding:6px 0 6px 22px;margin-bottom:24px}
.note.on{border-left-color:var(--gold)}
.note h3{font-size:30px;font-weight:700}
.note p{font-size:22px;color:var(--muted);margin-top:6px;line-height:1.4}
/* recap */
.rtitle{font-size:72px;font-weight:800;letter-spacing:-1px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;width:1700px;margin-top:60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:34px 30px;text-align:left;min-height:270px}
.card .n{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:2px}
.card h3{font-size:34px;font-weight:800;margin:14px 0 14px;line-height:1.15}
.card p{font-size:25px;color:var(--muted);line-height:1.4}
.rules{display:flex;gap:18px;margin-top:46px;flex-wrap:wrap;justify-content:center}
.rule{font-size:26px;padding:14px 26px;border-radius:999px;border:1px solid rgba(242,181,68,.4);color:var(--gold2)}
.url{font-size:36px;font-weight:600;margin-top:40px;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:16px 32px;border-radius:16px}
.disc{font-size:24px;color:var(--muted);margin-top:34px}
</style></head>
<body><div id="stage"></div>
<script>
const LOGO=(id)=>`<svg viewBox="0 0 512 512" style="width:100%;height:100%;display:block"><defs><linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D4C6C"/><stop offset="1" stop-color="#0E2A3D"/></linearGradient><linearGradient id="g${id}" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#E9A53A"/><stop offset="1" stop-color="#FFD27A"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#bg${id})" stroke="rgba(255,255,255,.08)" stroke-width="4"/><g transform="translate(-18 -8)"><path class="lp-gray" d="M256 304 L150 244" fill="none" stroke="#5F7C92" stroke-width="26" stroke-linecap="round" pathLength="1"/><circle class="lp-gdot" cx="150" cy="244" r="20" fill="#0F2C40" stroke="#5F7C92" stroke-width="10"/><path class="lp-stem" d="M256 430 L256 304" fill="none" stroke="#EAF1F6" stroke-width="28" stroke-linecap="round" pathLength="1"/><path class="lp-gold" d="M256 304 C 326 300 372 250 390 128" fill="none" stroke="url(#g${id})" stroke-width="28" stroke-linecap="round" pathLength="1"/><circle class="lp-end" cx="390" cy="118" r="30" fill="url(#g${id})"/><circle class="lp-node" cx="256" cy="304" r="20" fill="#EAF1F6"/></g></svg>`;

const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const outBack=x=>{x=clamp(x);const c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};

const D1=10.5, L1=24, D2=D1+L1, L2=38, R0=D2+L2, RL=8, O0=R0+RL, OL=6.5;
window.DURATION=O0+OL;

const scenes=[
 {id:'intro',s:0,e:5.5},{id:'hook',s:5.5,e:D1},{id:'demo1',s:D1,e:D2},{id:'demo2',s:D2,e:R0},{id:'recap',s:R0,e:O0},{id:'outro',s:O0,e:O0+OL+1}
];

const demo1={pill:'Example 1 · A small decision',msgs:[
 {k:'u',t:1.0,text:"Should I go to a dinner event tomorrow? The seat is $20, and I'd have to cancel two lessons worth $100."},
 {k:'think',t:4.0,t1:5.0},
 {k:'c',t:5.1,av:1,html:"<b>Small decision, easy to undo.</b> Here's my lean right away."},
 {k:'c',t:7.3,html:"<span class=lbl>Put a price on it</span>$20 seat + $100 in lost lessons = <b class=gold>$120</b>. Would you pay $120 in cash for this dinner?"},
 {k:'c',t:10.3,html:"<span class=lbl>Hidden option</span>Reschedule the lessons instead of cancelling. Then the evening costs $20, and your students keep trusting you."},
 {k:'c',t:13.3,html:"<span class=lbl>Will it come again?</span>It's a yearly event, so skipping it costs little."},
 {k:'c',t:15.8,html:"<div class=lean><b>My lean:</b> Go if both students can reschedule. Otherwise, skip it.<br><span class=muted>Confidence: medium</span></div>"},
 {k:'c',t:18.3,html:"<span class=lbl>Next step</span>Message both students today. Their answers make the decision for you."},
],notes:[
 {t:5.1,h:'Size the decision',p:'Small and easy to undo, so lead with a lean, not a list of questions.'},
 {t:7.3,h:'Put a price on it',p:'Add hidden costs into one number, then ask the cash test.'},
 {t:10.3,h:'Find the hidden option',p:'Reschedule instead of cancel. Students are a repeated game.'},
 {t:13.3,h:'Will it come again?',p:'A yearly event lowers the cost of saying no.'},
 {t:15.8,h:'A clear lean',p:'A recommendation with a confidence level, not a balanced list.'},
 {t:18.3,h:'One next step',p:'Something concrete to do today.'},
]};

const demo2={pill:'Example 2 · A big decision',msgs:[
 {k:'u',t:0.8,text:"Should I quit my job to start my own business?"},
 {k:'think',t:2.4,t1:3.2},
 {k:'c',t:3.4,av:1,html:"<b>Big and hard to undo.</b> Three questions first:<ol><li>Have paying customers tested your idea?</li><li>How many months could you live on zero income?</li><li>Could you get a similar job back within a year?</li></ol>"},
 {k:'u',t:7.8,text:"I have 6 paying customers on weekends. 8 months of savings. And yes, my field is hiring."},
 {k:'think',t:10.6,t1:11.4},
 {k:'c',t:11.6,av:1,html:"<span class=lbl>Clear the lens</span>You're pulled toward the business, not running from the job. That's a good sign."},
 {k:'c',t:14.6,html:"<span class=lbl>Compound interest</span>A salary resets every month. A business you own compounds: skills, customers, reputation."},
 {k:'c',t:17.6,html:"<span class=lbl>Inversion</span>It's a year later and it failed. Why? Most likely, cash ran out before revenue grew."},
 {k:'c',t:20.6,html:"<span class=lbl>Evolution</span>Test small before the big bet: grow weekend income to half your salary first."},
 {k:'c',t:23.6,html:"<div class=lean><b>My lean:</b> Yes, but not yet. Quit when side income reaches 50% of your salary.<br><span class=muted>Confidence: medium-high</span></div>"},
 {k:'c',t:26.6,html:"<span class=lbl>Your avoidance rules</span>Keep 6 months of expenses untouched. If revenue doesn't cover rent by month 6, start interviewing."},
 {k:'c',t:29.6,html:"<span class=lbl>Next step</span>This week: book 5 more customers and raise prices for new ones."},
 {k:'c',t:32.2,html:"<span class=muted><i>I don't bear the consequences of this choice. You own the decision.</i></span>"},
],notes:[
 {t:3.4,h:'Focused intake',p:'Big and hard to undo: at most 3 questions, then stop.'},
 {t:11.6,h:'Clear the lens',p:'Check for identity traps, sunk costs, and fear.'},
 {t:14.6,h:'Compound Interest',p:'Which option builds something that grows?'},
 {t:17.6,h:'Inversion',p:'Imagine it failed. What caused it?'},
 {t:20.6,h:'Evolution',p:'Cheap experiments beat one big forecast.'},
 {t:23.6,h:'A clear lean',p:'Yes, but not yet: a lean with a condition.'},
 {t:26.6,h:'Avoidance rules',p:'Concrete rules against the failure found earlier.'},
 {t:29.6,h:'One next step',p:'Something concrete to do this week.'},
 {t:32.2,h:'Skin in the game',p:'The coach bears no consequences. You own the decision.'},
]};

const stage=document.getElementById('stage');
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}

// intro
stage.appendChild(el(`<div class="scene center" id="intro"><div id="ilogo" style="width:260px;height:260px">${LOGO('i')}</div><h1 class="big" id="ititle" style="margin-top:44px">Decision Coach</h1><div class="sub" id="isub">A Claude skill for better decisions, built on<br>Naval Ravikant's mental models</div></div>`));
// hook
stage.appendChild(el(`<div class="scene center" id="hook"><div class="hookq" id="hq">Stuck on a decision?</div><div class="chips"><div class="chip" id="c1">Should I quit my job?</div><div class="chip" id="c2">Should I invest in my friend's restaurant?</div><div class="chip" id="c3">Should I go tonight, or rest?</div></div><div class="hookline" id="hl">Decision Coach helps you think it through, step by step.</div></div>`));

function buildDemo(id,d){
 const s=el(`<div class="scene" id="${id}"><div class="topbar"><div class="brand"><div style="width:56px;height:56px">${LOGO(id+'b')}</div>Decision Coach</div><div class="pill">${d.pill}</div></div>
 <div class="chat"><div class="chathead"><div class="dot"></div><div class="dot"></div><div class="dot"></div><span style="margin-left:14px">Chat with Claude</span><span class="tag">decision-coach skill active</span></div><div class="viewport"><div class="content"></div></div></div>
 <div class="notes"><div class="noteshead">What the skill is doing</div><div class="nview"><div class="ncontent"></div></div></div></div>`);
 stage.appendChild(s);
 const content=s.querySelector('.content'),nc=s.querySelector('.ncontent');
 d.msgs.forEach((m,i)=>{
  const row=document.createElement('div');row.className='row';const inner=document.createElement('div');inner.className='inner';
  if(m.k==='u'){inner.innerHTML=`<div class="ubub"><span class="tx"></span><span class="caret"></span></div>`}
  else if(m.k==='think'){inner.innerHTML=`<div class="think"><span></span><span></span><span></span></div>`}
  else{inner.innerHTML=`<div class="coach"><div class="av ${m.av?'':'ph'}">${m.av?LOGO(id+'a'+i):''}</div><div class="cb">${m.html}</div></div>`}
  row.appendChild(inner);content.appendChild(row);m.row=row;m.inner=inner;
 });
 d.notes.forEach(n=>{const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="note"><h3>${n.h}</h3><p>${n.p}</p></div>`;nc.appendChild(row);n.row=row;n.note=row.firstChild});
 d.scene=s;d.content=content;d.nc=nc;d.vp=s.querySelector('.viewport');d.nv=s.querySelector('.nview');
}
buildDemo('demo1',demo1);buildDemo('demo2',demo2);

stage.appendChild(el(`<div class="scene center" id="recap"><div class="rtitle">Four models. <span class="gold">Naval's rules.</span></div><div class="cards">
<div class="card"><div class="n">01</div><h3>Compound Interest</h3><p>Does today's work make tomorrow's work easier?</p></div>
<div class="card"><div class="n">02</div><h3>Inversion</h3><p>What would guarantee failure? Remove it.</p></div>
<div class="card"><div class="n">03</div><h3>Game Theory &amp; Evolution</h3><p>Is this a repeated game? Can I test it small?</p></div>
<div class="card"><div class="n">04</div><h3>Principal-Agent</h3><p>What happens to the advisor if they're wrong?</p></div></div>
<div class="rules"><div class="rule">If you can't decide, the answer is no</div><div class="rule">Run uphill</div><div class="rule">Long-term games with long-term people</div><div class="rule">Never risk ruin</div></div></div>`));

stage.appendChild(el(`<div class="scene center" id="outro"><div id="ologo" style="width:220px;height:220px">${LOGO('o')}</div><h1 class="big" style="margin-top:36px;font-size:88px">Decision Coach</h1><div class="sub">Clearer thinking. A clear lean. One next step.</div><div class="url">github.com/lumka1-png/decision-coach</div><div class="disc">A thinking partner, not a substitute for professional advice.</div></div>`));

const $=id=>document.getElementById(id);
function show(e,p,dy=24){e.style.opacity=p;e.style.transform=`translateY(${(1-p)*dy}px)`}
function drawLogo(root,t){ // t: 0..1 progress of draw
 const q=s=>root.querySelector(s);
 const a=ease(t/0.35),b=ease((t-0.3)/0.25),c=ease((t-0.45)/0.45);
 q('.lp-stem').style.strokeDasharray=1;q('.lp-stem').style.strokeDashoffset=1-a;
 q('.lp-gray').style.strokeDasharray=1;q('.lp-gray').style.strokeDashoffset=1-b;q('.lp-gdot').style.opacity=b;
 q('.lp-gold').style.strokeDasharray=1;q('.lp-gold').style.strokeDashoffset=1-c;
 q('.lp-end').style.opacity=ease((t-0.85)/0.15);q('.lp-node').style.opacity=ease((t-0.25)/0.1);
}

function renderDemo(d,rt){
 d.msgs.forEach(m=>{
  let p;
  if(m.k==='u'){
   if(rt<m.t){m.row.style.height='0px';m.row.style.opacity=0;return}
   const n=Math.floor((rt-m.t)*36);const done=n>=m.text.length;
   m.inner.querySelector('.tx').textContent=m.text.slice(0,n);
   m.inner.querySelector('.caret').style.opacity=done?0:((Math.floor(rt*3)%2)?0.2:1);
   p=ease((rt-m.t)/0.25);
  }else if(m.k==='think'){
   p=ease((rt-m.t)/0.3)*(1-ease((rt-m.t1)/0.3));
   m.inner.querySelectorAll('.think span').forEach((s,i)=>s.style.opacity=0.3+0.7*Math.max(0,Math.sin(rt*7-i*0.9)));
  }else{p=ease((rt-m.t)/0.45)}
  m.row.style.height=(m.inner.offsetHeight*p)+'px';
  m.row.style.opacity=m.k==='c'?ease((rt-m.t-0.1)/0.4):p;
 });
 const ch=d.content.offsetHeight,vh=d.vp.clientHeight;d.content.style.transform=`translateY(${-Math.max(0,ch-vh)}px)`;
 let last=-1;d.notes.forEach((n,i)=>{const p=ease((rt-n.t)/0.45);n.row.style.height=(n.note.offsetHeight+24)*p+'px';n.row.style.opacity=p;if(rt>=n.t)last=i});
 d.notes.forEach((n,i)=>{n.note.classList.toggle('on',i===last);if(rt>=n.t)n.row.style.opacity=i===last?1:0.45});
 const nh=d.nc.offsetHeight,nvh=d.nv.clientHeight;d.nc.style.transform=`translateY(${-Math.max(0,nh-nvh)}px)`;
}

window.__render=function(t){
 scenes.forEach(s=>{const e=$(s.id);let o=ease((t-s.s)/0.5)*(1-ease((t-(s.e-0.5))/0.5));if(s.id==='intro')o=1-ease((t-(s.e-0.5))/0.5);e.style.opacity=o;e.style.display=o>0.001?'flex':'none';if(s.id.startsWith('demo'))e.style.display=o>0.001?'block':'none'});
 // intro
 if(t<6){const lg=$('ilogo');lg.style.transform=`scale(${0.85+0.15*outBack(t/0.9)})`;lg.style.opacity=ease(t/0.4);drawLogo(lg,(t-0.2)/1.8);show($('ititle'),ease((t-1.3)/0.6));show($('isub'),ease((t-1.9)/0.6))}
 if(t>=5&&t<11){const r=t-5.5;show($('hq'),ease(r/0.5));show($('c1'),ease((r-0.8)/0.4),16);show($('c2'),ease((r-1.4)/0.4),16);show($('c3'),ease((r-2.0)/0.4),16);show($('hl'),ease((r-2.9)/0.5))}
 if(t>=D1-0.1&&t<D2+0.1)renderDemo(demo1,t-D1);
 if(t>=D2-0.1&&t<R0+0.1)renderDemo(demo2,t-D2);
 if(t>=R0-0.1){const r=t-R0;document.querySelectorAll('#recap .card').forEach((c,i)=>show(c,ease((r-0.6-i*0.45)/0.45),30));document.querySelectorAll('#recap .rule').forEach((c,i)=>show(c,ease((r-3.0-i*0.35)/0.4),14));show(document.querySelector('#recap .rtitle'),ease(r/0.5))}
 if(t>=O0-0.1){const r=t-O0;const lg=$('ologo');lg.style.opacity=1;drawLogo(lg,r/1.6);document.querySelectorAll('#outro .big,#outro .sub,#outro .url,#outro .disc').forEach((e,i)=>show(e,ease((r-0.9-i*0.4)/0.5),18))}
};
window.__render(0);
</script></body></html>
