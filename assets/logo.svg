<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Decision Coach</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173F5A"/>
      <stop offset="1" stop-color="#0B2233"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E9A53A"/>
      <stop offset="1" stop-color="#FFD27A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(-18 -8)">
  <!-- easy path: flat, fades out -->
  <path d="M256 304 L150 244" fill="none" stroke="#5F7C92" stroke-width="26" stroke-linecap="round"/>
  <circle cx="150" cy="244" r="20" fill="#0F2C40" stroke="#5F7C92" stroke-width="10"/>
  <!-- stem: where you stand -->
  <path d="M256 430 L256 304" fill="none" stroke="#EAF1F6" stroke-width="28" stroke-linecap="round"/>
  <!-- uphill path: compounding curve -->
  <path d="M256 304 C 326 300 372 250 390 128" fill="none" stroke="url(#gold)" stroke-width="28" stroke-linecap="round"/>
  <circle cx="390" cy="118" r="30" fill="url(#gold)"/>
  <circle cx="256" cy="304" r="20" fill="#EAF1F6"/>
  </g>
</svg>
